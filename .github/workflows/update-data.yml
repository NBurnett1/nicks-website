name: ASX Trading Pipeline

on:
  schedule:
    # Live trading session: 10:30am AEST (23:30 UTC previous day) — 30 min live
    - cron: '30 23 * * 0-4'  # Sun-Thu UTC = Mon-Fri AEST
    # Maintain run: 4pm AEST (5:00 UTC) — update prices, check exits only
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading mode'
        required: true
        default: 'maintain'
        type: choice
        options:
          - live
          - maintain

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --- ASX Valuation Pipeline (runs before live session) ---
      - name: Run ASX valuation pipeline
        if: github.event.schedule == '30 23 * * 0-4' || github.event.inputs.mode == 'live'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_pipeline.py --exchange ASX --skip-reports

      # --- Trading Engine ---
      - name: Determine trading mode
        id: mode
        run: |
          if [[ "${{ github.event.schedule }}" == "30 23 * * 0-4" ]] || [[ "${{ github.event.inputs.mode }}" == "live" ]]; then
            echo "flag=--live" >> $GITHUB_OUTPUT
            echo "Trading mode: LIVE (30 min session)"
          else
            echo "flag=--maintain" >> $GITHUB_OUTPUT
            echo "Trading mode: MAINTAIN (prices & exits only)"
          fi

      - name: Run ASX trading engine
        run: python scripts/simulate_trades.py ${{ steps.mode.outputs.flag }}

      # --- Commit and Push ---
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: ASX trading update [$(date -u +%Y-%m-%d' '%H:%M)]

          Mode: ${{ steps.mode.outputs.flag }}"
          git push
