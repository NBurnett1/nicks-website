name: ASX Trading Pipeline

on:
  schedule:
    # Run 2x daily: market open (10am AEST = 11pm UTC) and close (4pm AEST = 5am UTC)
    - cron: '0 23 * * 1-5'  # Market open (Mon-Fri)
    - cron: '0 5 * * 1-5'   # Market close (Mon-Fri)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --- ASX Valuation Pipeline ---
      - name: Run ASX valuation pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_pipeline.py --exchange ASX --skip-reports

      # --- Trading Engine ---
      - name: Run ASX trading engine
        run: python scripts/simulate_trades.py

      # --- Commit and Push ---
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: ASX data refresh [$(date -u +%Y-%m-%d' '%H:%M)]

          - ASX valuations, alerts, and trading engine updated"
          git push
