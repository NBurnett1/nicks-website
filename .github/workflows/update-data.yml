name: ASX Daily Picks Pipeline

on:
  schedule:
    # DAILY 6am AEST (20:00 UTC previous day)
    # Refresh valuation data, generate picks, fetch news
    - cron: '0 20 * * *'

    # MON-FRI 5pm AEST (7:00 UTC)
    # Mid-day price update + alerts refresh
    - cron: '0 7 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        default: 'full-pipeline'
        type: choice
        options:
          - full-pipeline
          - picks-only
          - news-only

permissions:
  contents: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ═══════════════════════════════════════════
      # FULL PIPELINE: Valuation scan + picks + news
      # ═══════════════════════════════════════════

      - name: Run ASX valuation pipeline
        if: github.event.inputs.mode != 'news-only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_pipeline.py --exchange ASX --skip-reports

      - name: Generate daily picks
        if: github.event.inputs.mode != 'news-only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily_picks.py

      # ═══════════════════════════════════════════
      # NEWS & ALERTS
      # ═══════════════════════════════════════════

      - name: Scan news & market alerts
        run: python scripts/fetch_alerts.py

      - name: Fetch daily top stories
        run: python scripts/fetch_top_stories.py

      # ═══════════════════════════════════════════
      # COMMIT + PUSH → triggers Vercel auto-deploy
      # ═══════════════════════════════════════════

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: daily picks refresh [$(date -u +%Y-%m-%d %H:%M)]

          Schedule: ${{ github.event.schedule || github.event.inputs.mode }}"
          git push
